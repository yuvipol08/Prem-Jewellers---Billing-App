appId: in.premjewellers.billing
productName: Prem Jewellers Billing
copyright: Copyright © Prem Jewellers, Jalgaon
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - '!**/*.map'
asar: true
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
# better-sqlite3 ships ABI-stable N-API prebuilds for every target platform, so
# there is nothing to compile — no Visual Studio Build Tools, no node-gyp, no
# Electron header download. Forcing a rebuild here would only add a toolchain
# dependency that can fail on a clean machine.
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-Setup.${ext}
portable:
  artifactName: ${productName}-${version}-Portable.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Prem Jewellers Billing
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.business
  artifactName: ${productName}-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
dmg:
  title: Prem Jewellers Billing
linux:
  target:
    - AppImage
  category: Office
