appId: in.premjewellers.billing
productName: Prem Jewellers Billing
copyright: Copyright © Prem Jewellers, Jalgaon
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - '!**/*.map'
asar: true
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
# better-sqlite3 ships ABI-stable N-API prebuilds for every target platform
# (node_modules/better-sqlite3/prebuilds/win32-x64.node and friends), so there is
# nothing to compile: no Visual Studio Build Tools, no Python, no node-gyp, no
# Electron header download. All three flags below are set because each closes a
# different route into a source rebuild, and a rebuild is never wanted here.
#
# NEVER run `electron-builder install-app-deps` on this project. That command
# ignores these settings, calls @electron/rebuild directly, and fails on any
# machine without Python and a C++ toolchain. It used to be wired to postinstall;
# it was removed for exactly this reason.
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-Setup.${ext}
portable:
  artifactName: ${productName}-${version}-Portable.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Prem Jewellers Billing
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.business
  artifactName: ${productName}-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
dmg:
  title: Prem Jewellers Billing
linux:
  target:
    - AppImage
  category: Office
